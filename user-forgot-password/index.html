    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Volt Esports Hub</title>
    <link rel="stylesheet" href="/tailwind-built.css?v=12.8">
    <script src="https://www.google.com/recaptcha/api.js?render=6LdII4wsAAAAAIt6pI5oslBpTqRIFP_iVJruh73L"></script>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&amp;display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap"></noscript>
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap"></noscript>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css"></noscript>
    <!-- Tailwind config moved to tailwind.config.js -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon.png">

    <style>
        /* OUTFIT FONT FIX */
        .font-display, .font-body, .font-sans { font-family: 'Outfit', sans-serif !important; }
    </style>
<style>
    /* Autofill fix for dark mode */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #111 inset !important;
        -webkit-text-fill-color: white !important;
        transition: background-color 5000s ease-in-out 0s;
        caret-color: white;
    }
</style>    <script src="../js/mock-backend.js"></script>
</head>


<body class="bg-[#0a0a0a] text-gray-200 font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">

    <nav class="bg-[#111111]/95 backdrop-blur-md shadow-sm border-b border-white/5 sticky top-0 z-50">
        <div class="px-4 py-4 text-center">
            <h1 class="text-2xl font-black tracking-tighter text-white">VOLT<span class="text-blue-500">ESPORTS HUB</span>
            </h1>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-sm bg-[#1a1a1a] rounded-3xl shadow-xl border border-white/10 p-8 transition-all">

            <!-- HEADER -->
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-blue-900/20 border border-blue-500/30 rounded-xl flex items-center justify-center mx-auto mb-4 text-blue-400 text-2xl">
                    <i class="ri-lock-password-line"></i>
                </div>
                <h2 class="text-2xl font-black text-white">Reset Password</h2>
                <p class="text-sm text-gray-400 font-medium">Recover your account access.</p>
            </div>

            <!-- STEP 1: PHONE VERIFICATION -->
            <form id="step-1-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Registered Phone</label>
                    <div class="relative group">
                        <i class="ri-phone-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-500 transition-colors z-10"></i>
                        <input type="tel" id="verify-phone" class="w-full p-4 pl-10 bg-[#111] border border-white/10 rounded-2xl font-bold text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-gray-600" placeholder="10-digit number" required="" maxlength="10">
                    </div>
                </div>

                <button type="submit" id="verify-btn" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-600/20 hover:bg-blue-700 transition-all transform active:scale-95 mt-2">
                    Verify via OTP
                </button>
            </form>

            <!-- STEP 2: NEW PASSWORD (HIDDEN INITIALLY) -->
            <form id="step-2-form" class="space-y-4 hidden">
                <div class="bg-green-900/20 p-3 rounded-xl border border-green-800/30 text-center mb-4">
                    <p class="text-xs font-bold text-green-400"><i class="ri-checkbox-circle-fill align-bottom"></i>
                        Phone Verified via OTP</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">New Password</label>
                    <div class="relative group">
                        <i class="ri-lock-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-500 transition-colors z-10"></i>
                        <input type="password" id="new-password" class="w-full p-4 pl-10 bg-[#111] border border-white/10 rounded-2xl font-bold text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all pr-12 placeholder-gray-600" placeholder="Enter new password" required="">
                        <i id="toggle-new-password" class="ri-eye-line absolute top-1/2 right-4 -translate-y-1/2 cursor-pointer text-gray-500 hover:text-white text-lg transition-colors"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1 ml-1">Confirm Password</label>
                    <div class="relative group">
                        <i class="ri-lock-check-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-500 transition-colors z-10"></i>
                        <input type="password" id="confirm-password" class="w-full p-4 pl-10 bg-[#111] border border-white/10 rounded-2xl font-bold text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all pr-12 placeholder-gray-600" placeholder="Confirm new password" required="">
                        <i id="toggle-confirm-password" class="ri-eye-line absolute top-1/2 right-4 -translate-y-1/2 cursor-pointer text-gray-500 hover:text-white text-lg transition-colors"></i>
                    </div>
                </div>

                <button type="submit" id="reset-btn" class="w-full bg-green-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-green-600/20 hover:bg-green-700 transition-all transform active:scale-95 mt-2">
                    Update Password
                </button>
            </form>

            <!-- MESSAGE DISPLAY -->
            <p id="form-message" class="text-center text-xs font-bold hidden mt-4 p-3 rounded-xl border"></p>

            <p class="text-center text-xs text-gray-500 mt-6 font-medium">
                Remembered it? <a href="../user-login/index.html" class="text-blue-500 font-bold hover:text-blue-400 hover:underline">Login here</a>
            </p>
        </div>
    </main>

    <!-- OTP VERIFICATION MODAL -->
    <div id="otp-modal" class="fixed inset-0 bg-black/80 z-[60] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#1a1a1a] border border-white/10 rounded-3xl w-full max-w-xs p-6 text-center shadow-2xl transform transition-all scale-100">
            <div class="w-16 h-16 rounded-full bg-blue-900/20 border border-blue-500/30 flex items-center justify-center mx-auto mb-4 text-blue-400 text-3xl">
                <i class="ri-shield-check-line"></i>
            </div>
            <h3 class="text-lg font-black text-white mb-1">Verify Phone</h3>
            <p class="text-sm text-gray-400 mb-1">OTP sent to</p>
            <p id="otp-phone-display" class="text-sm font-bold text-blue-400 mb-5">+91 XXXXXXXXXX</p>

            <!-- OTP Input -->
            <div id="otp-input-container" class="flex justify-center gap-2 mb-4">
                <input type="tel" maxlength="1" class="otp-digit w-11 h-12 bg-[#111] border border-white/10 rounded-xl text-center text-white font-black text-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" data-idx="0">
                <input type="tel" maxlength="1" class="otp-digit w-11 h-12 bg-[#111] border border-white/10 rounded-xl text-center text-white font-black text-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" data-idx="1">
                <input type="tel" maxlength="1" class="otp-digit w-11 h-12 bg-[#111] border border-white/10 rounded-xl text-center text-white font-black text-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" data-idx="2">
                <input type="tel" maxlength="1" class="otp-digit w-11 h-12 bg-[#111] border border-white/10 rounded-xl text-center text-white font-black text-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" data-idx="3">
                <input type="tel" maxlength="1" class="otp-digit w-11 h-12 bg-[#111] border border-white/10 rounded-xl text-center text-white font-black text-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" data-idx="4">
                <input type="tel" maxlength="1" class="otp-digit w-11 h-12 bg-[#111] border border-white/10 rounded-xl text-center text-white font-black text-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" data-idx="5">
            </div>

            <p id="otp-error" class="text-xs font-bold text-red-400 mb-3 hidden"></p>

            <button id="verify-otp-btn" class="w-full bg-blue-600 text-white font-black py-3.5 rounded-xl shadow-lg shadow-blue-600/20 hover:bg-blue-700 transition-all transform active:scale-95 mb-3">
                Verify OTP
            </button>

            <div class="flex items-center justify-between text-xs">
                <span id="otp-timer" class="text-gray-500 font-bold">Resend in <span id="otp-countdown">30</span>s</span>
                <button id="resend-otp-btn" class="text-blue-500 font-bold hover:text-blue-400 hidden">Resend
                    OTP</button>
            </div>

            <button id="close-otp-modal" class="mt-4 text-xs font-bold text-gray-500 hover:text-gray-300">Cancel</button>
        </div>
    </div>

    <script defer="" src="user-forgot-password.min.js?v=12.8"></script>


</body></html>
