    <main class="flex-grow px-6 py-6 max-w-lg mx-auto w-full">

        <!-- Period Filters -->
        <div class="bg-[#1a1a1a] p-1 rounded-xl flex gap-1 mb-6 shadow-sm border border-white/5">
            <button onclick="loadLeaderboard('week')" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all text-gray-400 bg-transparent hover:bg-white/5 filter-btn" data-period="week">Weekly</button>
            <button onclick="loadLeaderboard('month')" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all text-white bg-blue-600 filter-btn" data-period="month">Monthly</button>
            <button onclick="loadLeaderboard('all')" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all text-gray-400 bg-transparent hover:bg-white/5 filter-btn" data-period="all">All Time</button>
        </div>

        <div id="leaderboard-list" class="space-y-3">
            <!-- Items injected by JS -->
        </div>

    <!-- Rankings JS (inline since this page has no external JS file) -->
    <script>
        const WORKER_URL = 'https://eagleesport.com/api/index.php';

        // Load Leaderboard
        async function loadLeaderboard(period) {
            // Update buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.period === period) {
                    btn.classList.remove('bg-transparent', 'text-gray-400', 'hover:bg-white/5');
                    btn.classList.add('bg-blue-600', 'text-white');
                } else {
                    btn.classList.add('bg-transparent', 'text-gray-400', 'hover:bg-white/5');
                    btn.classList.remove('bg-blue-600', 'text-white');
                }
            });

            const list = document.getElementById('leaderboard-list');
            list.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                </div>`;

            try {
                const res = await fetch(`${WORKER_URL}?action=getLeaderboard&period=${period}`);
                const data = await res.json();

                if (!data.data || data.data.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-12">
                            <i class="ri-trophy-line text-4xl text-gray-300 mb-2"></i>
                            <p class="text-gray-400 text-sm font-bold">No rankings available yet.</p>
                        </div>`;
                    return;
                }

                list.innerHTML = '';
                data.data.forEach((row, i) => {
                    const rank = i + 1;
                    const isTop = rank === 1;
                    const div = document.createElement('div');

                    const bgClass = isTop ? "bg-gradient-to-r from-blue-600 to-blue-800 shadow-lg text-white border-none" : "bg-[#1a1a1a] text-white border border-white/5 shadow-sm";
                    const rankBadge = isTop ? 'bg-[#FFD700] text-gray-900' : 'bg-white/10 text-gray-400';
                    const textCol = isTop ? 'text-white' : 'text-white';
                    const subTextCol = isTop ? 'text-white/60' : 'text-gray-500';
                    const ptsCol = isTop ? 'text-white' : 'text-white';

                    div.className = `${bgClass} rounded-2xl p-4 flex items-center justify-between transition-transform active:scale-[0.98]`;

                    div.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 ${rankBadge} rounded-full flex items-center justify-center font-black text-lg shadow-sm font-display relative">
                                ${rank}
                                ${isTop ? '<i class="ri-vip-crown-fill absolute -top-3 text-2xl text-[#FFD700]"></i>' : ''}
                            </div>
                            <div>
                                <h4 class="font-black ${textCol} text-base tracking-tight leading-none mb-1">${row.team_name}</h4>
                                <p class="text-[10px] ${subTextCol} font-bold uppercase tracking-wider flex items-center gap-2">
                                    <span><i class="ri-sword-fill"></i> ${row.kills} Kills</span>
                                    <span><i class="ri-trophy-fill"></i> ${row.booyahs} Booyahs</span>
                                </p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-black ${ptsCol} leading-none tracking-tighter">${row.points}</p>
                            <p class="text-[9px] ${subTextCol} font-black uppercase tracking-widest">PTS</p>
                        </div>`;
                    list.appendChild(div);
                });

            } catch (e) {
                list.innerHTML = '<p class="text-center text-red-400 text-sm py-8 font-bold">Error loading rankings.</p>';
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadLeaderboard('month');
        });
    </script>
