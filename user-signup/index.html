<body class="bg-[#0a0a0a] text-gray-200 font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">

    <nav class="bg-[#111111]/95 backdrop-blur-md shadow-sm border-b border-white/5 sticky top-0 z-50">
        <div class="px-4 py-4 text-center">
            <h1 class="text-2xl font-black tracking-tighter text-white">VOLT<span class="text-blue-500">ESPORTS HUB</span>
            </h1>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-sm bg-[#1a1a1a] rounded-3xl shadow-xl border border-white/10 p-8">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-black text-white">Player Sign Up</h2>
                <p class="text-sm text-gray-400 font-medium">Create your player profile.</p>
            </div>

            <form id="signup-form" class="space-y-4">

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">In-Game Name (IGN)</label>
                    <div class="relative group">
                        <i class="ri-user-3-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-500 transition-colors z-10"></i>
                        <input type="text" id="ign" class="w-full p-4 pl-10 bg-[#111] border border-white/10 rounded-2xl font-bold text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-gray-600" placeholder="e.g. VoltKing" required="">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Phone Number</label>
                    <div class="relative group">
                        <i class="ri-phone-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-500 transition-colors z-10"></i>
                        <input type="tel" id="phone" class="w-full p-4 pl-10 bg-[#111] border border-white/10 rounded-2xl font-bold text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-gray-600" placeholder="10-digit number" required="" maxlength="10" oninput="this.value = this.value.replace(/\s/g, '')">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Age</label>
                    <input type="number" id="age" class="w-full p-4 bg-[#111] border border-white/10 rounded-2xl font-bold text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-gray-600" placeholder="Your age" required="">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Password</label>
                    <div class="relative group">
                        <i class="ri-lock-password-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-500 transition-colors z-10"></i>
                        <input type="password" id="password" class="w-full p-4 pl-10 bg-[#111] border border-white/10 rounded-2xl font-bold text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all pr-12 placeholder-gray-600" placeholder="Create Password" required="">
                        <i id="toggle-password" class="ri-eye-line absolute top-1/2 right-4 -translate-y-1/2 cursor-pointer text-gray-500 hover:text-white text-lg transition-colors"></i>
                    </div>
                </div>
                <p id="form-error" class="text-center text-red-400 text-xs font-bold hidden bg-red-900/20 p-2 rounded-lg border border-red-800/30">
                </p>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-600/20 hover:bg-blue-700 transition-all transform active:scale-95 mt-2">
                    Sign Up
                </button>
            </form>

            <div class="relative my-5 flex items-center justify-center">
                <div class="border-t border-white/10 w-full"></div>
                <span class="bg-[#1a1a1a] px-3 text-xs font-bold text-gray-500 uppercase">OR</span>
                <div class="border-t border-white/10 w-full"></div>
            </div>

            <button type="button" id="google-signup-btn" class="w-full bg-white/5 border border-white/10 hover:bg-white/10 text-white font-bold py-3.5 rounded-2xl flex items-center justify-center gap-3 transition-all mb-4">
                <i class="ri-google-fill text-xl text-red-400"></i> Continue with Google
            </button>

            <p class="text-center text-xs text-gray-500 mt-6 font-medium">
                Already have a profile? <a href="../user-login/index.html" class="text-blue-500 font-bold hover:text-blue-400 hover:underline">Login
                    here</a>
            </p>
        </div>
    </main>



    <script>
        // Initialize Firebase
        const FIREBASE_CONFIG = {
            apiKey: atob("QUl6YVN5Q2Fqc0pSSEpBMUpXQ0VxYzV5WFdDZzdSUVE4SnM2RHRR"),
            authDomain: "freefire-8d87b.firebaseapp.com",
            projectId: "freefire-8d87b",
            storageBucket: "freefire-8d87b.firebasestorage.app",
            messagingSenderId: "838166280757",
            appId: "1:838166280757:web:aa4f042abff7569b32cf7c",
            measurementId: "G-YBQ3RE6EVL"
        };
        firebase.initializeApp(FIREBASE_CONFIG);
        const auth = firebase.auth();
        const db = firebase.firestore();
        try { db.settings({ experimentalForceLongPolling: true }); } catch(e) {}

        // State
        let formData = {};

        document.addEventListener('DOMContentLoaded', () => {

            // --- TOGGLE PASSWORD VISIBILITY ---
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-password');

            toggleIcon.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.classList.toggle('ri-eye-line');
                toggleIcon.classList.toggle('ri-eye-off-line');
            });

            // --- OTP INPUT AUTO-FOCUS ---
            const otpDigits = document.querySelectorAll('.otp-digit');
            otpDigits.forEach((input, idx) => {
                input.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/[^0-9]/g, '');
                    e.target.value = val;
                    if (val && idx < otpDigits.length - 1) {
                        otpDigits[idx + 1].focus();
                    }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                        otpDigits[idx - 1].focus();
                    }
                });
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasted = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, 6);
                    pasted.split('').forEach((ch, i) => {
                        if (otpDigits[i]) otpDigits[i].value = ch;
                    });
                    if (pasted.length > 0) otpDigits[Math.min(pasted.length, 5)].focus();
                });
            });

            // --- FORM SUBMISSION → SEND OTP ---
            document.getElementById('signup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submit-btn');
                const errorEl = document.getElementById('form-error');

                const ign = document.getElementById('ign').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const password = document.getElementById('password').value.trim();
                const ageVal = document.getElementById('age').value.trim();
                const age = parseInt(ageVal, 10);

                // Validation
                if (phone.length !== 10) {
                    errorEl.textContent = "Phone number must be 10 digits.";
                    errorEl.classList.remove('hidden');
                    return;
                }
                if (isNaN(age) || age < 16) {
                    errorEl.textContent = "Minimum age required is 16 years.";
                    errorEl.classList.remove('hidden');
                    return;
                }
                if (password.length < 4) {
                    errorEl.textContent = "Password must be at least 4 characters.";
                    errorEl.classList.remove('hidden');
                    return;
                }

                formData = { ign, phone, password, age };

                btn.disabled = true;
                btn.textContent = "Checking...";
                errorEl.classList.add('hidden');

                try {
                    let alreadyExists = false;
                    try {
                        const userDoc = await db.collection('users').doc(phone).get();
                        if (userDoc && userDoc.exists) {
                            alreadyExists = true;
                        }
                    } catch (fsErr) {
                        console.warn("Firestore user check offline or error, checking local store:", fsErr);
                        const localUsers = JSON.parse(localStorage.getItem('volt_registered_users') || '{}');
                        if (localUsers[phone]) {
                            alreadyExists = true;
                        }
                    }

                    if (alreadyExists) {
                        errorEl.textContent = "Phone number already registered. Please login.";
                        errorEl.classList.remove('hidden');
                        btn.disabled = false;
                        btn.textContent = "Sign Up";
                        return;
                    }

                    // DIRECTLY SAVE USER PROFILE (SMS Verification Removed)
                    btn.textContent = "Creating Profile...";
                    
                    const userData = {
                        id: phone,
                        phone: phone,
                        in_game_name: ign,
                        name: ign,
                        username: ign,
                        password: password,
                        age: age,
                        createdAt: new Date().toISOString()
                    };

                    try {
                        await db.collection('users').doc(phone).set(userData);
                    } catch (fsErr) {
                        console.warn("Firestore save failed, saving to local fallback store:", fsErr);
                    }

                    // Save to local registry fallback
                    const localUsers = JSON.parse(localStorage.getItem('volt_registered_users') || '{}');
                    localUsers[phone] = userData;
                    localStorage.setItem('volt_registered_users', JSON.stringify(localUsers));

                    btn.textContent = "Profile Created!";
                    btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                    btn.classList.add('bg-green-600');

                    setTimeout(() => {
                        window.location.href = '../user-login/index.html';
                    }, 1500);

                } catch (err) {
                    console.error('Error:', err);
                    errorEl.textContent = err.message || 'Something went wrong. Try again.';
                    errorEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = "Sign Up";
                }
            });

            // --- GOOGLE SIGN IN ---
            const googleBtn = document.getElementById('google-signup-btn');
            if (googleBtn) {
                googleBtn.addEventListener('click', async () => {
                    const errorEl = document.getElementById('form-error');
                    errorEl.classList.add('hidden');
                    try {
                        const provider = new firebase.auth.GoogleAuthProvider();
                        const result = await firebase.auth().signInWithPopup(provider);
                        const user = result.user;

                        const playerObj = {
                            id: user.uid,
                            phone: user.phoneNumber || user.email || user.uid,
                            email: user.email || '',
                            in_game_name: user.displayName || 'Google Player',
                            name: user.displayName || 'Google Player',
                            username: user.displayName || 'Google Player',
                            photoURL: user.photoURL || '',
                            is_leader: 0,
                            team_id: null,
                            createdAt: new Date().toISOString()
                        };

                        try {
                            await db.collection('users').doc(user.uid).set(playerObj, { merge: true });
                        } catch (e) {
                            console.warn("Firestore save Google user error:", e);
                        }

                        const sessionData = {
                            status: 'success',
                            has_team: false,
                            team_data: null,
                            player_data: playerObj
                        };
                        localStorage.setItem('playerSession', JSON.stringify(sessionData));

                        setTimeout(() => {
                            window.location.href = '../user-dashboard/index.html';
                        }, 200);
                    } catch (err) {
                        console.error('Google Sign In Error:', err.code, err.message, err);
                        errorEl.textContent = `[${err.code || 'auth/error'}] ${err.message || "Google Sign-In failed."}`;
                        errorEl.classList.remove('hidden');
                    }
                });
            }
        });
    </script>


</body></html>
